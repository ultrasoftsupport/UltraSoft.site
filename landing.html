<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraSoft | المنظومة الرقمية للحلول والاشتراكات</title>
    <link rel="icon" type="image/png" href="./src/assets/icons/ultrasoft_transparent.png">
    
    <link rel="stylesheet" href="./src/css/ultrasoft-theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ألترا سوفت">
    <link rel="apple-touch-icon" href="./src/assets/icons/ultrasoft_transparent.png">

    <script>
        // Prevent FOUC: load and apply theme variables from LocalStorage immediately
        (function() {
            try {
                const savedTheme = localStorage.getItem('ultrasoft_active_theme') || localStorage.getItem('devo_active_theme');
                if (savedTheme) {
                    const theme = JSON.parse(savedTheme);
                    const colors = theme.colors;
                    if (colors) {
                        const styleEl = document.createElement('style');
                        styleEl.id = 'devo-theme-styles-early';
                        const bgHex = colors.page?.bg || '#0b1329';
                        const isLight = bgHex !== '#0b1329' && bgHex !== '#0f172a' && bgHex !== '#0a0a0a' && bgHex !== '#171717';
                        const defaultGray = isLight ? (colors.brand?.secondary || '#e1effe') : '#1e293b';
                        const defaultGrayHover = isLight ? (colors.brand?.secondary_hover || '#bae6fd') : '#334155';
                        const devoGray = colors.borders?.color || defaultGray;
                        const devoGrayHover = colors.brand?.secondary_hover || defaultGrayHover;

                        let cssText = `
                            :root {
                                --devo-black: ${colors.page?.bg || '#0b1329'};
                                --devo-dark: ${colors.page?.bg_secondary || colors.page?.surface || '#0f172a'};
                                --devo-gray: ${devoGray};
                                --devo-gray-hover: ${devoGrayHover};
                                --devo-orange: ${colors.brand?.primary || '#0284c7'};
                                --devo-orange-hover: ${colors.brand?.primary_hover || '#0369a1'};
                                --devo-text: ${colors.page?.text || '#f8fafc'};
                                --devo-muted: ${colors.page?.text_muted || '#cbd5e1'};
                                --devo-success: ${colors.alerts?.success?.text || '#10b981'};
                                --devo-error: ${colors.alerts?.error?.text || '#ef4444'};
                                --devo-warning: ${colors.alerts?.warning?.text || '#f59e0b'};
                                --devo-info: ${colors.alerts?.info?.text || '#38bdf8'};
                                --selection-bg: ${colors.page?.selection_bg || '#0284c7'};
                                --selection-text: ${colors.page?.selection_text || '#ffffff'};
                                --border-color: ${devoGray};
                                --border-width: ${colors.borders?.width || '1px'};
                                --border-radius-base: ${colors.borders?.radius || '12px'};
                                --shadow-color: ${colors.shadows?.color || 'rgba(0,0,0,0.8)'};
                                --shadow-size: ${colors.shadows?.size || '10px'};
                                --shadow-blur: ${colors.shadows?.blur || '40px'};
                            }
                        `;
                        styleEl.innerHTML = cssText;
                        document.head.appendChild(styleEl);
                    }
                }
            } catch(e) { console.error('Theme early load error:', e); }
        })();
    </script>
    <script>
        const withOpacity = (variableName, fallback) => {
            return ({ opacityValue }) => {
                if (opacityValue !== undefined) {
                    return `color-mix(in srgb, var(${variableName}, ${fallback}) calc(100% * ${opacityValue}), transparent)`;
                }
                return `var(${variableName}, ${fallback})`;
            };
        };

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ultra: {
                            50: '#F0F9FF',
                            100: '#E0F2FE',
                            200: '#BAE6FD',
                            300: '#7DD3FC',
                            400: '#38BDF8',
                            500: '#0EB5D4',
                            600: '#0284C7',
                            700: '#0369A1',
                            800: '#075985',
                            900: '#0C4A6E',
                            950: '#082F49'
                        },
                        devo: {
                            black: withOpacity('--devo-black', '#0b1329'),
                            dark: withOpacity('--devo-dark', '#0f172a'),
                            gray: withOpacity('--devo-gray', '#1e293b'),
                            grayHover: withOpacity('--devo-gray-hover', '#334155'),
                            orange: withOpacity('--devo-orange', '#0284c7'),
                            orangeHover: withOpacity('--devo-orange-hover', '#0369a1'),
                            text: withOpacity('--devo-text', '#f8fafc'),
                            muted: withOpacity('--devo-muted', '#cbd5e1'),
                            success: withOpacity('--devo-success', '#10b981'),
                            error: withOpacity('--devo-error', '#ef4444'),
                            warning: withOpacity('--devo-warning', '#f59e0b'),
                            info: withOpacity('--devo-info', '#38bdf8')
                        }
                    },
                    fontFamily: { sans: ['Alexandria', 'Cairo', 'Tajawal', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Alexandria', 'Cairo', 'Tajawal', sans-serif; letter-spacing: -0.01em; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--devo-black, #0b1329); }
        ::-webkit-scrollbar-thumb { background: var(--devo-gray, #1e293b); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--devo-orange, #0284c7); }
    </style>
</head>
<body class="bg-devo-black text-devo-text overflow-x-hidden flex flex-col min-h-screen">

            <!-- Right: Logo -->

            <!-- Center: Interactive Module Navigation Links -->

                <button id="nav-link-pricing" onclick="window.switchLandingModule?.('pricing')" class="px-3.5 py-2 text-xs sm:text-sm font-bold text-devo-muted hover:text-white transition-all">

                </button>

                <button onclick="window.scrollToContact?.()" class="hidden sm:block px-3.5 py-2 text-xs sm:text-sm font-bold text-devo-muted hover:text-white transition-all">
                    تواصل معنا
                </button>
            </div>

            <!-- Left: Action Buttons -->
            <div class="flex items-center gap-2.5 shrink-0">
                <a href="index.html" class="px-4 py-2 bg-devo-dark hover:bg-devo-gray border border-devo-gray text-white rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="ph ph-storefront text-sky-400 text-base"></i>
                    <span>المعرض التجريبي</span>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 pt-24">
        <div id="view-landing" class="block"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-devo-dark border-t border-devo-gray py-8 mt-auto text-center text-xs text-devo-muted">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <img src="./logo_transparnt.png" onerror="this.src='./logo.png';" alt="UltraSoft" class="h-6 w-auto">
                <span class="font-bold text-devo-text">&copy; <span id="landing-year">2026</span> UltraSoft Software Solutions. جميع الحقوق محفوظة.</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="https://wa.me/201140409832" target="_blank" class="hover:text-emerald-400 transition-colors flex items-center gap-1"><i class="ph ph-whatsapp-logo text-base"></i> واتساب</a>
                <a href="tel:+201140409832" class="hover:text-sky-400 transition-colors flex items-center gap-1"><i class="ph ph-phone text-base"></i> هاتف</a>
                <a href="https://www.facebook.com/share/1NiodPNtXF/" target="_blank" class="hover:text-blue-400 transition-colors flex items-center gap-1"><i class="ph ph-facebook-logo text-base"></i> فيسبوك</a>
            </div>
        </div>
    </footer>

    <!-- JS Imports -->
    <script type="module">
        import { initLandingPage } from './src/js/pages/home/ultrasoft_landing.js';
        import { syncActiveTheme } from './src/js/services/theme.js';

        document.addEventListener('DOMContentLoaded', () => {
            syncActiveTheme();
            initLandingPage();
            
            const yr = document.getElementById('landing-year');
            if (yr) yr.textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
